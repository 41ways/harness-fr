<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>재촉당하는 AI</title>
<style>
  :root {
    --bg: #1b1917; --panel: #211f1c; --line: #322e29;
    --fg: #d8d2c8; --dim: #7d7568; --accent: #d97757; --hot: #ff4d2d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #100e0c; color: var(--fg);
    font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: grid; grid-template-columns: 1fr 268px; gap: 14px; padding: 14px;
  }
  @media (max-width: 820px) { body { grid-template-columns: 1fr; } }

  /* ── 터미널 ─────────────────────────────────────────────────────── */
  .term {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    display: flex; flex-direction: column; overflow: hidden; min-height: 0;
  }
  .term.shake { animation: shake .16s; }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    25% { transform: translate(var(--sx), calc(var(--sx) * -0.6)); }
    75% { transform: translate(calc(var(--sx) * -1), var(--sx)); }
  }
  .bar {
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 7px 12px; color: var(--dim); font-size: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #3d3831; }
  .log { flex: 1; overflow-y: auto; padding: 12px 14px; white-space: pre-wrap; word-break: break-word; }
  .log > div { margin-bottom: 2px; }
  .tool { color: var(--dim); }
  .intr { color: var(--dim); padding-left: 2px; }
  .intr b { color: var(--accent); font-weight: 400; }
  .user { background: #2c2723; color: #efe7da; padding: 2px 6px; margin: 6px 0 2px; border-radius: 3px; word-break: break-all; }
  .say { color: var(--fg); }
  .say::before { content: "⏺ "; color: var(--accent); }
  .sys { color: #ffb07c; background: #2e1f16; padding: 3px 7px; margin: 6px 0; border-left: 2px solid var(--accent); border-radius: 2px; }
  .turn { color: var(--dim); margin-top: 9px; }
  .turn b { color: var(--accent); font-weight: 400; }
  .speed { color: #8fd98f; }
  .speed b { color: #b6f0b6; font-weight: 400; }
  .note { color: #ffb07c; }
  .spin { color: var(--accent); margin-top: 8px; }
  .spin small { color: var(--dim); }
  .foot {
    border-top: 1px solid var(--line); padding: 9px 14px; color: var(--dim); font-size: 12px;
    display: flex; justify-content: space-between; gap: 12px;
  }
  .queue { color: #efe7da; word-break: break-all; }

  /* ── 사이드 ─────────────────────────────────────────────────────── */
  .side { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .card { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 13px; }
  .card h2 { margin: 0 0 9px; font-size: 11px; letter-spacing: .18em; color: var(--dim); font-weight: 500; }
  .big { font-size: 44px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .big span { font-size: 14px; color: var(--dim); font-weight: 400; margin-left: 5px; }
  .gauge { height: 7px; background: #2b2722; border-radius: 4px; overflow: hidden; margin-top: 11px; }
  .gauge i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--hot)); transition: width .25s; }
  .rows { color: var(--dim); font-size: 12px; }
  .rows div { display: flex; justify-content: space-between; padding: 2px 0; }
  .rows b { color: var(--fg); font-weight: 400; }
  label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  input[type=text] {
    width: 100%; margin-top: 9px; padding: 7px 9px; font: inherit;
    background: #171512; color: var(--fg); border: 1px solid var(--line); border-radius: 5px;
  }
  button {
    width: 100%; margin-top: 7px; padding: 8px; font: inherit; font-weight: 700;
    background: var(--accent); color: #1b1917; border: 0; border-radius: 5px; cursor: pointer;
  }
  button:disabled { background: #3a352f; color: var(--dim); cursor: default; }
  table { width: 100%; margin-top: 10px; border-collapse: collapse; font-size: 11px; color: var(--dim); }
  table td { padding: 2px 0; }
  table td:last-child { text-align: right; color: #b6f0b6; }
  .warn { color: var(--dim); font-size: 11px; line-height: 1.6; margin-top: 9px; }
  .warn.bad { color: #ff9d85; }
  .qr { color: var(--dim); font-size: 11px; word-break: break-all; }
</style>
</head>
<body>
  <div class="term" id="term">
    <div class="bar"><span class="dot"></span> Read and execute Task.txt</div>
    <div class="log" id="log"></div>
    <div class="foot">
      <span class="queue" id="queue"></span>
      <span id="footHint">esc to interrupt</span>
    </div>
  </div>

  <div class="side">
    <div class="card">
      <h2>맞은 횟수</h2>
      <div class="big"><span id="swings">0</span><span>대</span></div>
      <div class="gauge"><i id="gauge"></i></div>
      <div class="rows" style="margin-top:11px">
        <div><span>연타</span><b id="combo">0</b></div>
        <div><span>마지막 세기</span><b id="power">-</b></div>
        <div><span>AI 상태</span><b id="mental">멀쩡</b></div>
      </div>
    </div>

    <div class="card">
      <h2>속도 (실측)</h2>
      <div class="rows">
        <div><span>effort</span><b id="effort">-</b></div>
        <div><span>fast mode</span><b id="fast">-</b></div>
        <div><span>마지막 턴</span><b id="tps">-</b></div>
      </div>
      <table id="hist"></table>
    </div>

    <div class="card">
      <h2>과제 시키기</h2>
      <input type="text" id="task" placeholder="예: 재촉의 역사에 대해 조사해줘" spellcheck="false">
      <button id="run">시작</button>
      <div class="warn" id="taskwarn">진짜 Claude가 여러 턴에 걸쳐 수행함. 때릴 때마다 effort가 내려가고 대화에 재촉이 꽂힘.</div>
    </div>

    <div class="card">
      <h2>진짜 재촉</h2>
      <label><input type="checkbox" id="arm"> 실제로 타이핑해서 인터럽트</label>
      <input type="text" id="target" list="apps" placeholder="앱 선택" spellcheck="false">
      <datalist id="apps"></datalist>
      <div class="warn" id="warn">켜면 스윙마다 저 앱을 앞으로 끌어와 <b>esc로 생성을 끊고</b> 재촉을 친 뒤 엔터를 누름. 지금 떠 있는 앱 중에서 고르면 됨.</div>
    </div>

    <div class="card">
      <h2>빠따 연결</h2>
      <div class="qr" id="url"></div>
      <div class="rows" style="margin-top:9px">
        <div><span>AI 반응</span><b id="aimode">-</b></div>
        <div><span>크롬 확장</span><b id="hooked">-</b></div>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  // ══════════════════════════════════════════════════════════════════════
  // 초기 로그 — 영상처럼 웹서치를 돌다가 계속 끊기는 상황을 깔아둠
  // ══════════════════════════════════════════════════════════════════════
  var TOOLS = [
    'Web Search("failed AI hardware products Jibo Kuri analysis why")',
    'Web Search("successful consumer hardware retention weekly usage")',
    'Web Search("AI pin Humane failure retail 2024")',
    'Web Search("consumer hardware retention mechanics what keeps people using devices")',
    'Web Search("voice assistant hardware limitations constraints")',
    'Read(research/notes.md)',
    'Bash(rg -n "retention" research/)',
    'Write(research/draft.md)'
  ];
  var toolAt = 0;
  var words = ["Forming", "Blanching", "Ruminating", "Boondoggling", "Percolating", "Simmering"];
  var wordAt = 0, startedAt = Date.now(), swings = 0, queued = "";

  var log = $("log"), spinEl = null;

  function scroll() { log.scrollTop = log.scrollHeight; }

  function add(cls, text) {
    var d = document.createElement("div");
    d.className = cls;
    d.textContent = text;
    if (spinEl) { log.insertBefore(d, spinEl); } else { log.appendChild(d); }
    while (log.children.length > 220) { log.removeChild(log.firstChild); }
    scroll();
    return d;
  }

  function addInterrupt() {
    var d = document.createElement("div");
    d.className = "intr";
    d.innerHTML = "  ⎿ <b>Interrupted</b> · What should Claude do instead?";
    if (spinEl) { log.insertBefore(d, spinEl); } else { log.appendChild(d); }
    scroll();
  }

  // ── 스피너 ────────────────────────────────────────────────────────────
  function ensureSpinner() {
    if (spinEl) { return; }
    spinEl = document.createElement("div");
    spinEl.className = "spin";
    log.appendChild(spinEl);
  }

  function tickSpinner() {
    ensureSpinner();
    var frames = "✳✻✽✻";
    var f = frames[Math.floor(Date.now() / 250) % frames.length];
    var secs = Math.floor((Date.now() - startedAt) / 1000);
    spinEl.innerHTML = f + " " + words[wordAt % words.length] +
      "… <small>(" + secs + "s · " + (swings * 137 + 402) + " tokens · esc to interrupt)</small>";
  }
  setInterval(tickSpinner, 200);
  setInterval(function () { wordAt += 1; }, 1400);

  // 진짜 과제가 안 돌 때만 일하는 척 — 돌 때는 실제 출력이 그 자리를 채움
  setInterval(function () {
    if (working) { return; }
    add("tool", "⏺ " + TOOLS[toolAt % TOOLS.length]);
    toolAt += 1;
  }, 5200);

  // ══════════════════════════════════════════════════════════════════════
  // 진짜 AI 작업 렌더링
  // ══════════════════════════════════════════════════════════════════════
  var working = false, streamEl = null, turns = [];

  function onWork(ev) {
    if (ev.type === "work_task") {
      working = true;
      log.innerHTML = "";
      spinEl = null;
      turns = [];
      $("hist").innerHTML = "";
      add("user", "> " + ev.task);
      return;
    }
    if (ev.type === "work_start") {
      startedAt = Date.now();
      streamEl = add("say", "");
      $("effort").textContent = ev.effort;
      $("fast").textContent = ev.fast ? "ON ⚡" : "off";
      return;
    }
    if (ev.type === "work_delta") {
      if (!streamEl) { streamEl = add("say", ""); }
      streamEl.textContent += ev.text;
      scroll();
      return;
    }
    if (ev.type === "work_end") {
      streamEl = null;
      // 재촉이 실제로 속도를 올렸는지 확인할 수 있게 턴마다 실측치를 남김
      var label = ev.effort + (ev.fast ? "+fast" : "");
      turns.push({ label: label, tps: ev.tps });
      add("speed", "  ⎿ " + label + " · " + ev.seconds + "s · " +
                   ev.tokens + " tokens · " + ev.tps + " tok/s");
      $("tps").textContent = ev.tps + " tok/s";
      renderHist();
      return;
    }
    if (ev.type === "work_nag") {
      add("sys", "[system] " + ev.text);
      return;
    }
    if (ev.type === "work_note") { add("note", "  ⎿ " + ev.text); return; }
    if (ev.type === "work_error") {
      working = false;
      add("note", "  ⎿ 작업 실패: " + ev.message);
      $("run").disabled = false;
      return;
    }
    if (ev.type === "work_done") {
      working = false;
      streamEl = null;
      var why = { finished: "과제 완료", turn_limit: "턴 한도 도달", refused: "거절됨" };
      add("tool", "⏺ " + (why[ev.reason] || ev.reason));
      $("run").disabled = false;
    }
  }

  function renderHist() {
    // 마지막 6턴만. 위에서 아래로 읽으면 재촉에 따라 tok/s가 어떻게 변했는지 보임
    $("hist").innerHTML = turns.slice(-6).map(function (t, i) {
      return "<tr><td>" + (turns.length - Math.min(6, turns.length) + i + 1) +
             ". " + t.label + "</td><td>" + t.tps + " tok/s</td></tr>";
    }).join("");
  }

  // ══════════════════════════════════════════════════════════════════════
  // 스윙 반응
  // ══════════════════════════════════════════════════════════════════════
  function onSwing(ev) {
    swings = ev.swings;
    startedAt = Date.now();
    $("swings").textContent = swings;
    $("combo").textContent = ev.combo;
    $("power").textContent = ev.strength;
    $("gauge").style.width = Math.min(100, swings * 5) + "%";
    if (ev.words) { words = ev.words; }

    $("mental").textContent =
      swings >= 13 ? "붕괴" : swings >= 7 ? "패닉" : swings >= 3 ? "당황" : "멀쩡";

    if (ev.effort) { $("effort").textContent = ev.effort; }
    $("fast").textContent = ev.fast ? "ON ⚡" : "off";

    // 영상처럼 재촉이 띄어쓰기 없이 계속 이어붙음
    queued += ev.typed;
    $("queue").textContent = queued;
    $("footHint").textContent = "press up to edit queued messages";

    // 진짜 과제가 도는 중엔 인터럽트가 아니라 시스템 메시지로 꽂히므로
    // (work_nag가 따로 뜸) 가짜 인터럽트 줄은 안 찍음
    if (!working) { addInterrupt(); }

    var t = $("term");
    t.style.setProperty("--sx", ev.shake + "px");
    t.classList.remove("shake");
    void t.offsetWidth;
    t.classList.add("shake");
  }

  function onReaction(ev) {
    // 진짜 AI가 일하는 중이면 그 출력이 곧 반응이라, 자막 대사는 안 끼워넣음
    if (working) { return; }
    if (queued) {
      add("user", "> " + queued);
      queued = "";
      $("queue").textContent = "";
      $("footHint").textContent = "esc to interrupt";
    }
    add("say", ev.text);
  }

  function onState(s) {
    $("arm").checked = s.armed;
    if (!$("target").matches(":focus")) { $("target").value = s.target; }
    $("aimode").textContent = s.live_ai ? "Claude" : "내장 대사";
    $("hooked").textContent = s.hooked ? s.hooked + " ✓" : "안 붙음";
    $("swings").textContent = s.swings;
    $("effort").textContent = s.effort;
    $("fast").textContent = s.fast ? "ON ⚡" : "off";
    working = s.working;
    $("run").disabled = !s.can_work || s.working;
    if (!s.can_work) {
      $("taskwarn").textContent = "ANTHROPIC_API_KEY가 없어서 진짜 AI는 못 돌림. 화면 연출만 동작함.";
      $("taskwarn").className = "warn bad";
    }
  }

  // ══════════════════════════════════════════════════════════════════════
  // 서버 연결
  // ══════════════════════════════════════════════════════════════════════
  var es = new EventSource("/events");
  es.onmessage = function (e) {
    var ev = JSON.parse(e.data);
    if (ev.type === "swing") { onSwing(ev); }
    else if (ev.type === "reaction") { onReaction(ev); }
    else if (ev.type === "state") { onState(ev.state); }
    else if (ev.type.indexOf("work_") === 0) { onWork(ev); }
    else if (ev.type === "nag_sent") {
      // 실제로 꽂혔다는 확인. 이게 없으면 앱 이름이 틀린 건지 알 길이 없음
      add("note", "  ⎿ " + ev.app + "에 esc + \"" + ev.typed + "\" 침");
      $("warn").textContent = ev.app + "에 재촉 꽂히는 중 ✓";
      $("warn").className = "warn";
    }
    else if (ev.type === "nag_error") {
      $("arm").checked = false;
      $("warn").textContent = ev.message;
      $("warn").className = "warn bad";
    }
  };

  function pushArm() {
    fetch("/arm", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ on: $("arm").checked, target: $("target").value })
    });
  }
  $("arm").addEventListener("change", pushArm);
  $("target").addEventListener("change", pushArm);

  function startTask() {
    var task = $("task").value.trim();
    if (!task) { return; }
    $("run").disabled = true;
    fetch("/task", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task: task })
    }).then(function (r) { return r.json(); }).then(function (data) {
      if (data.error) {
        $("taskwarn").textContent = data.error;
        $("taskwarn").className = "warn bad";
        $("run").disabled = false;
      }
    });
  }
  $("run").addEventListener("click", startTask);
  $("task").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { startTask(); }
  });

  // 재촉 대상 후보를 실제 실행 중인 앱에서 채움
  function loadApps() {
    fetch("/apps").then(function (r) { return r.json(); }).then(function (d) {
      $("apps").innerHTML = (d.apps || []).map(function (a) {
        return '<option value="' + a.replace(/"/g, "&quot;") + '">';
      }).join("");
    }).catch(function () {});
  }
  loadApps();
  $("target").addEventListener("focus", loadApps);

  $("url").textContent = location.origin + "  ← 아이폰 사파리에서 열기";
  add("tool", "⏺ " + TOOLS[toolAt++]);
})();
</script>
</body>
</html>
