<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>깡! - 깡통 괴롭히기</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
  :root { --hit: #ff5a36; --dim: #6b6257; }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #14110e; color: #efe6d8;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; overflow: hidden;
    transition: background .08s;
  }
  body.hit { background: var(--hit); }
  h1 { font-size: 15px; letter-spacing: .28em; margin: 0 0 4px; color: var(--dim); font-weight: 500; }
  /* 유니코드에 야구 배트 단독 글자가 없어서(🏏는 크리켓 배트+공) 직접 그림.
     각도는 자이로를 받아 rAF로 매 프레임 직접 넣어서 transition은 안 검 —
     CSS 전환을 걸면 실시간 추적이 한 박자씩 밀림 */
  .bat { margin: 18px 0; transform-origin: 50% 88%; will-change: transform; }
  .bat svg { display: block; width: 104px; height: 104px; }
  .count { font-size: 76px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .count small { font-size: 20px; color: var(--dim); font-weight: 500; margin-left: 6px; }
  .last { margin-top: 14px; font-size: 15px; min-height: 22px; color: var(--hit); font-weight: 700; }
  body.hit .last { color: #14110e; }
  .meter { width: 240px; height: 5px; background: #2a241d; border-radius: 3px; margin-top: 16px; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--hit); transition: width .1s; }
  button {
    font: inherit; font-size: 17px; font-weight: 700; padding: 18px 30px; margin-top: 26px;
    background: var(--hit); color: #14110e; border: 0; border-radius: 14px;
  }
  button:active { transform: scale(.97); }
  .hint { margin-top: 20px; font-size: 12px; color: var(--dim); line-height: 1.7; max-width: 280px; }
  .err { color: #ffb4a0; font-size: 13px; margin-top: 14px; max-width: 280px; line-height: 1.6; }
  .hidden { display: none; }
  /* 화면 밖에 두되 display:none은 안 됨 — 안 보이면 클릭 이벤트가 안 먹어서
     햅틱도 안 울림 */
  #hap { position: fixed; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  /* 휘두르다 잘못 누르지 않게 구석에. 대신 손가락으로 칠 만큼은 크게 */
  #mute {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 14px;
    margin: 0; padding: 0; width: 46px; height: 46px; font-size: 20px;
    background: #221d18; color: #efe6d8; border: 1px solid #3a332a; border-radius: 50%;
  }
  #mute.off { opacity: .45; }
</style>
</head>
<body>
  <h1>C L A N K E R &nbsp; B A T</h1>
  <div class="bat" id="bat">
    <svg viewBox="0 0 200 200" aria-label="야구 배트">
      <defs>
        <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#8a5a2b"/>
          <stop offset=".42" stop-color="#d8a163"/>
          <stop offset=".72" stop-color="#b87a3d"/>
          <stop offset="1" stop-color="#7a4c22"/>
        </linearGradient>
      </defs>
      <!-- 위가 배럴, 아래가 노브. 길이:배럴 지름을 대략 7:1로 잡아야 배트로 보임 -->
      <path d="M100 12 C109 12 114 21 114 33 C114 55 114 62 112 76
               C110 100 106 122 105 146 C105 156 104 166 104 172
               C104 178 110 181 110 186 C110 191 105 195 100 195
               C95 195 90 191 90 186 C90 181 96 178 96 172
               C96 166 95 156 95 146 C94 122 90 100 88 76
               C86 62 86 55 86 33 C86 21 91 12 100 12 Z"
            fill="url(#wood)" stroke="#4a2c12" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- 나뭇결 + 손잡이 테이프 -->
      <path d="M100 34 C100 80 100 120 100 160" stroke="#00000022" stroke-width="2.5" fill="none"/>
      <path d="M95 160 H105 M95 168 H105 M95 176 H105" stroke="#00000033" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>

  <div id="ready" class="hidden">
    <div class="count"><span id="count">0</span><small>대</small></div>
    <div class="last" id="last">휘두르면 됨</div>
    <div class="meter"><i id="meter"></i></div>
    <div class="hint" id="hint">폰을 빠따처럼 쥐고 휘두르면 됨.<br>세게 칠수록 세게 재촉함</div>
  </div>

  <!-- iOS 햅틱용. switch 체크박스를 토글하면 시스템 진동이 울려서 그걸 빌려 씀 -->
  <label id="hap" aria-hidden="true"><input type="checkbox" switch></label>

  <button id="mute" type="button" aria-label="소리 켜기/끄기">🔊</button>

  <div id="start">
    <button id="go">빠따 잡기</button>
    <div class="hint">아이폰은 센서 권한을 한 번 물어봄<br>허용해야 스윙이 잡힘</div>
    <div class="err hidden" id="err"></div>
  </div>

<script>
(function () {
  "use strict";

  // ══════════════════════════════════════════════════════════════════════
  // 스윙 감지 파라미터
  // ══════════════════════════════════════════════════════════════════════
  var FIRE = 14;        // 이 가속도(m/s^2)를 넘으면 스윙 시작으로 봄
  var RESET = 6;        // 다시 이 밑으로 내려와야 다음 스윙을 받음
  var COOLDOWN = 320;   // 한 번 친 뒤 최소 간격(ms). 손 떨림 연타 방지

  var swinging = false, peak = 0, lastHit = 0, count = 0;
  var audio = null;

  var $ = function (id) { return document.getElementById(id); };

  // ══════════════════════════════════════════════════════════════════════
  // 배트 모션 — 자이로로 실시간 추적 + 스윙 아크 애니메이션
  //
  // 평소엔 폰 기울기를 그대로 따라가서 손에 든 배트처럼 굴고, 스윙이 잡히면
  // 그 위에 휘두르는 궤적을 얹음. 궤적 방향은 실제 회전 방향(rotationRate)을
  // 따라가서 오른쪽으로 휘두르면 오른쪽으로 돔
  // ══════════════════════════════════════════════════════════════════════
  var SWING_MS = 420;
  var tilt = 24, tiltTarget = 24;          // 현재/목표 기울기(deg)
  var swingAt = -1e9, swingDir = 1, swingPower = 0;
  var spinRate = 0;                        // 최근 회전 속도 (방향 판별용)

  function onOrientation(e) {
    // gamma: 좌우 기울기(-90~90). 손목을 눕히는 각도가 배트 각도랑 제일 잘 맞음
    // beta: 앞뒤 기울기. 살짝만 섞어서 들어올린 느낌을 냄
    if (e.gamma === null) { return; }
    tiltTarget = Math.max(-95, Math.min(95, e.gamma + (e.beta || 0) * 0.25));
  }

  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function lerp(a, b, x) { return a + (b - a) * x; }

  function swingAngle(t) {
    // 뒤로 살짝 젖혔다가(테이크백) → 빠르게 훑고 → 되돌아옴
    var through = (78 + swingPower * 46) * swingDir;
    var back = -20 * swingDir;
    if (t < 0.18) { return lerp(0, back, t / 0.18); }
    if (t < 0.52) { return lerp(back, through, easeOut((t - 0.18) / 0.34)); }
    return lerp(through, 0, easeOut((t - 0.52) / 0.48));
  }

  function frame() {
    var el = $("bat");
    if (el) {
      tilt += (tiltTarget - tilt) * 0.18;   // 손떨림이 그대로 보이지 않게 완만히
      var t = (performance.now() - swingAt) / SWING_MS;
      var angle = tilt;
      var scale = 1;
      if (t >= 0 && t < 1) {
        angle = tilt + swingAngle(t);
        scale = 1 + 0.16 * Math.sin(Math.PI * Math.min(t / 0.6, 1));
      }
      el.style.transform = "rotate(" + angle.toFixed(1) + "deg) scale(" + scale.toFixed(3) + ")";
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ══════════════════════════════════════════════════════════════════════
  // 스윙 소리 — 폰에서는 "휭" (배트가 공기를 가르는 소리)
  //
  // 맞는 소리("딱")는 여기가 아니라 맥 대시보드에서 남. 폰은 배트를 쥔 손,
  // 맥은 공이 맞는 자리라서 역할을 나눔
  // ══════════════════════════════════════════════════════════════════════
  // 음소거는 소리만 끔 — 진동은 그대로 둠. 조용한 데서 몰래 재촉하려면
  // 오히려 그 조합이 필요해서
  var muted = localStorage.getItem("clankerMuted") === "1";

  function applyMute() {
    var b = $("mute");
    b.textContent = muted ? "🔇" : "🔊";
    b.classList.toggle("off", muted);
  }

  function whoosh(strength) {
    if (!audio || muted) { return; }
    var t = audio.currentTime;
    var power = Math.min(strength, 60) / 60;         // 0~1로 정규화
    var dur = 0.16 + power * 0.12;

    // 휭 소리의 본체는 백색소음. 밴드패스를 위로 훑었다가 내리면
    // 물체가 옆을 스쳐 지나가는 느낌이 남 (도플러 흉내)
    var buf = audio.createBuffer(1, Math.ceil(audio.sampleRate * dur), audio.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < data.length; i++) { data[i] = Math.random() * 2 - 1; }

    var src = audio.createBufferSource();
    src.buffer = buf;

    var bp = audio.createBiquadFilter();
    bp.type = "bandpass";
    bp.Q.value = 1.1;
    var peakHz = 620 + power * 1500;                 // 세게 칠수록 날카롭게
    bp.frequency.setValueAtTime(260, t);
    bp.frequency.exponentialRampToValueAtTime(peakHz, t + dur * 0.42);
    bp.frequency.exponentialRampToValueAtTime(200, t + dur);

    var gain = audio.createGain();
    var vol = 0.12 + power * 0.5;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + dur * 0.38);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    src.connect(bp).connect(gain).connect(audio.destination);
    src.start(t);
    src.stop(t + dur);
  }

  // ══════════════════════════════════════════════════════════════════════
  // 진동
  //
  // iOS 사파리는 navigator.vibrate를 아예 지원 안 함. 대신 iOS 17.4+에서
  // switch 스타일 체크박스를 토글하면 시스템 햅틱이 울리는 걸 이용함.
  // 안드로이드는 navigator.vibrate가 정석이라 그쪽을 먼저 씀
  // ══════════════════════════════════════════════════════════════════════
  function hapticLabel() {
    // 진동이 어느 경로로 도는지 화면에 알려줌 — 안 울릴 때 원인을 바로 알게
    return navigator.vibrate ? "진동: 켜짐" : "진동: iOS 방식(안 울릴 수 있음)";
  }

  function haptic(strength) {
    if (navigator.vibrate) {
      // 패턴은 [진동, 멈춤, 진동, ...] ms 순서. 첫 값이 진동 길이라서
      // [0, n]으로 주면 0ms 울리고 끝나 아무것도 안 느껴짐 (여기서 한 번 틀림)
      //
      // 웹 진동 API에는 세기(진폭) 조절이 없음 — 길이만 조절 가능함.
      // 그래서 체감을 올리려면 길게, 그리고 짧은 간격으로 여러 번 끊어 침.
      // 끊어 치면 모터가 계속 재기동해서 한 번 길게 울리는 것보다 더 세게 느껴짐
      var pattern;
      if (strength < 22) {                                          // 살짝
        pattern = [70];
      } else if (strength < 45) {                                   // 제대로
        pattern = [140, 30, 70];
      } else {                                                      // 홈런
        pattern = [220, 35, 110, 35, 90, 40, 70];
      }
      var ok = navigator.vibrate(pattern);
      if (!ok) { note("진동 거부됨 (기기 설정 확인)"); }
      return;
    }
    // iOS 사파리는 navigator.vibrate가 없어서 switch 햅틱을 빌려 씀
    var label = $("hap");
    if (!label) { return; }
    label.click();
    if (strength >= 45) { setTimeout(function () { label.click(); }, 70); }
  }

  function flash(strength) {
    document.body.classList.add("hit");
    setTimeout(function () { document.body.classList.remove("hit"); }, 110);
    $("meter").style.width = Math.min(100, strength / 60 * 100) + "%";
    setTimeout(function () { $("meter").style.width = "0"; }, 400);
  }

  // ══════════════════════════════════════════════════════════════════════
  // 서버로 스윙 전송
  // ══════════════════════════════════════════════════════════════════════
  function hit(strength) {
    count += 1;
    $("count").textContent = count;

    // 스윙 궤적 시작. 방향은 실제로 돈 쪽을 따라감
    swingAt = performance.now();
    swingDir = spinRate < 0 ? -1 : 1;
    swingPower = Math.min(strength, 60) / 60;

    flash(strength);
    whoosh(strength);
    haptic(strength);

    fetch("/swing", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ strength: strength })
    }).then(function (r) { return r.json(); }).then(function (data) {
      $("last").textContent = data.subtitle || "";
      if (typeof data.swings === "number") {
        count = data.swings;         // 여러 대에서 쳐도 서버 카운트로 맞춤
        $("count").textContent = count;
      }
    }).catch(function () {
      $("last").textContent = "서버 연결 끊김";
    });
  }

  // ══════════════════════════════════════════════════════════════════════
  // 가속도 처리
  // ══════════════════════════════════════════════════════════════════════
  function onMotion(e) {
    // 회전 속도는 스윙 궤적 방향을 정하는 데만 씀. gamma축(손목 비트는 축)이
    // 야구 스윙이랑 제일 잘 맞음
    if (e.rotationRate && e.rotationRate.gamma !== null) {
      var r = e.rotationRate.gamma;
      if (Math.abs(r) > Math.abs(spinRate) * 0.6) { spinRate = r; }
    }
    var a = e.acceleration;
    // 아이폰은 중력 제외 가속도를 주지만, 안 주는 기기는 중력 포함값에서
    // 9.8을 빼서 근사함
    if (!a || a.x === null) {
      var g = e.accelerationIncludingGravity;
      if (!g || g.x === null) { return; }
      a = { x: g.x, y: g.y, z: g.z };
      var mag0 = Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z);
      handle(Math.abs(mag0 - 9.81));
      return;
    }
    handle(Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z));
  }

  function handle(mag) {
    var now = Date.now();
    if (swinging) {
      if (mag > peak) { peak = mag; }
      // 스윙이 잦아들면 그때의 피크값을 세기로 확정
      if (mag < RESET) {
        swinging = false;
        if (now - lastHit > COOLDOWN) { lastHit = now; hit(peak); }
        peak = 0;
      }
      return;
    }
    if (mag > FIRE && now - lastHit > COOLDOWN) {
      swinging = true;
      peak = mag;
    }
  }

  // ══════════════════════════════════════════════════════════════════════
  // 시작
  // ══════════════════════════════════════════════════════════════════════
  function begin() {
    window.addEventListener("devicemotion", onMotion, { passive: true });
    askOrientation();
    $("start").classList.add("hidden");
    $("ready").classList.remove("hidden");
    $("hint").textContent = "폰을 빠따처럼 쥐고 휘두르면 됨. " + hapticLabel();
    // 오디오는 사용자 제스처 안에서 만들어야 iOS가 열어줌 — 버튼 탭이 그 자리
    try {
      audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") { audio.resume(); }
    } catch (e) { audio = null; }
  }

  function askOrientation() {
    // iOS는 자이로(orientation) 권한을 모션과 별도로 물어봄. 거부해도
    // 스윙 감지는 멀쩡하고 배트가 실시간 추적만 못 하니 조용히 넘어감
    if (typeof DeviceOrientationEvent === "undefined") { return; }
    if (typeof DeviceOrientationEvent.requestPermission === "function") {
      DeviceOrientationEvent.requestPermission().then(function (res) {
        if (res === "granted") {
          window.addEventListener("deviceorientation", onOrientation, { passive: true });
        } else {
          $("hint").textContent = "자이로 권한 없음. 배트가 기울기를 못 따라감. 스윙은 됨";
        }
      }).catch(function () {});
      return;
    }
    window.addEventListener("deviceorientation", onOrientation, { passive: true });
  }

  function fallback(msg) {
    // 센서를 못 쓰면 화면 자체를 빠따로 씀 — 세게 재촉은 못 하지만 동작은 함
    $("err").textContent = msg + " 화면 탭하면 스윙으로 침";
    $("err").classList.remove("hidden");
    $("start").classList.add("hidden");
    $("ready").classList.remove("hidden");
    $("hint").textContent = "화면 탭할 때마다 한 대씩. " + hapticLabel();
    document.body.addEventListener("click", function () {
      if (Date.now() - lastHit > COOLDOWN) { lastHit = Date.now(); hit(30); }
    });
  }

  applyMute();
  $("mute").addEventListener("click", function (e) {
    e.stopPropagation();      // 폴백 모드에서 탭이 스윙으로 세지 않게
    muted = !muted;
    localStorage.setItem("clankerMuted", muted ? "1" : "0");
    applyMute();
  });

  $("go").addEventListener("click", function () {
    if (typeof DeviceMotionEvent === "undefined") {
      fallback("이 기기엔 모션 센서가 없음.");
      return;
    }
    if (typeof DeviceMotionEvent.requestPermission === "function") {
      DeviceMotionEvent.requestPermission().then(function (res) {
        if (res === "granted") { begin(); }
        else { fallback("센서 권한이 거부됐음."); }
      }).catch(function () {
        fallback("센서 권한 요청이 실패했음 (https가 아닐 수 있음).");
      });
      return;
    }
    begin();
  });
})();
</script>
</body>
</html>
